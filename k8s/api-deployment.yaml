apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthcare-api

  template:
    metadata:
      labels:
        app: healthcare-api

    spec:
      containers:
        - name: healthcare-api
          image: IMAGE_API
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
