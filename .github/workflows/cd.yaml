name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - '**'

jobs:
  build-push-deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-1
      ECR_REGISTRY: 074839636183.dkr.ecr.us-west-1.amazonaws.com
      ECR_REPOSITORY_API: healthcare-api
      ECR_REPOSITORY_GRADIO: healthcare-gradio
      EKS_CLUSTER_NAME: healthcare-eks
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:

      # ---------------------------------
      # Checkout
      # ---------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------------
      # Configure AWS credentials
      # ---------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::074839636183:role/GitHubActions-EKS-Deploy

      # ---------------------------------
      # Install DVC
      # ---------------------------------

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"

      # ---------------------------------
      # Pull DVC artifacts
      # ---------------------------------

      - name: Pull DVC artifacts
        run: |
          dvc pull -r s3store

      # ---------------------------------
      # Login to Amazon ECR
      # ---------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------
      # Build API
      # ---------------------------------

      - name: Build API image
        run: |
          docker build \
            -t $ECR_REPOSITORY_API:$IMAGE_TAG \
            -f Dockerfile.api .

      - name: Tag API image
        run: |
          docker tag \
            $ECR_REPOSITORY_API:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      - name: Push API image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      # ---------------------------------
      # Build Gradio
      # ---------------------------------

      - name: Build Gradio image
        run: |
          docker build \
            -t $ECR_REPOSITORY_GRADIO:$IMAGE_TAG \
            -f Dockerfile.gradio .

      - name: Tag Gradio image
        run: |
          docker tag \
            $ECR_REPOSITORY_GRADIO:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG

      - name: Push Gradio image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG

      # ---------------------------------
      # Configure Kubernetes
      # ---------------------------------

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ---------------------------------
      # Deploy to EKS
      # ---------------------------------

      - name: Update Kubernetes manifests
        run: |
          sed -i \
            "s|IMAGE_API|$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG|g" \
            k8s/api-deployment.yaml

          sed -i \
            "s|IMAGE_GRADIO|$ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG|g" \
            k8s/gradio-deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/

      - name: Wait for API deployment
        run: |
          kubectl rollout status \
            deployment/healthcare-api \
            --timeout=5m

      - name: Wait for Gradio deployment
        run: |
          kubectl rollout status \
            deployment/healthcare-gradio \
            --timeout=5m