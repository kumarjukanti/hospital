name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - '**'

jobs:
  build-push-deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-1
      ECR_REGISTRY: 074839636183.dkr.ecr.us-west-1.amazonaws.com
      ECR_REPOSITORY_API: healthcare-api
      ECR_REPOSITORY_GRADIO: healthcare-gradio
      EKS_CLUSTER_NAME: healthcare-eks
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:

      # ---------------------------------
      # Checkout
      # ---------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------------
      # Debug GitHub OIDC claims
      # ---------------------------------

      - name: Debug OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          echo "$ID_TOKEN" \
            | cut -d '.' -f 2 \
            | base64 -d 2>/dev/null \
            | jq '{
                aud,
                sub,
                repository,
                repository_id,
                repository_owner,
                repository_owner_id,
                workflow,
                workflow_ref,
                ref,
                ref_type,
                event_name
              }'

      # ---------------------------------
      # Configure AWS credentials
      # ---------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::074839636183:role/GitHubActions-EKS-Deploy

      # ---------------------------------
      # Verify AWS and S3 access
      # ---------------------------------

      - name: Verify AWS and S3 access
        run: |
          echo "========================================"
          echo "=== AWS IDENTITY ==="
          echo "========================================"

          aws sts get-caller-identity

          echo ""
          echo "========================================"
          echo "=== BUCKET REGION ==="
          echo "========================================"

          aws s3api get-bucket-location \
            --bucket healthcare-mlops-dvc-074839636183

          echo ""
          echo "========================================"
          echo "=== LIST DVC OBJECTS ==="
          echo "========================================"

          aws s3api list-objects-v2 \
            --bucket healthcare-mlops-dvc-074839636183 \
            --prefix dvc/files/md5/ \
            --max-keys 10 \
            --query 'Contents[].Key' \
            --output text

          echo ""
          echo "========================================"
          echo "=== HEAD DVC PREFIX ==="
          echo "========================================"

          aws s3api head-object \
            --bucket healthcare-mlops-dvc-074839636183 \
            --key 'dvc/files/md5' \
            || echo "Expected: dvc/files/md5 is a prefix, not an object."

          echo ""
          echo "========================================"
          echo "=== HEAD REAL DVC OBJECT ==="
          echo "========================================"

          aws s3api head-object \
            --bucket healthcare-mlops-dvc-074839636183 \
            --key 'dvc/files/md5/10/65faa7ac90b3ec24363587a13013ba'

          echo ""
          echo "========================================"
          echo "=== DOWNLOAD REAL DVC OBJECT ==="
          echo "========================================"

          aws s3 cp \
            s3://healthcare-mlops-dvc-074839636183/dvc/files/md5/10/65faa7ac90b3ec24363587a13013ba \
            /tmp/test-dvc-object

          echo ""
          echo "========================================"
          echo "=== S3 ACCESS TESTS COMPLETED ==="
          echo "========================================"

      # ---------------------------------
      # Install DVC
      # ---------------------------------

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"

      # ---------------------------------
      # Pull DVC artifacts
      # ---------------------------------

      - name: Pull DVC artifacts
        run: |
          dvc pull -r s3store

      # ---------------------------------
      # Login to Amazon ECR
      # ---------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------
      # Build API
      # ---------------------------------

      - name: Build API image
        run: |
          docker build \
            -t $ECR_REPOSITORY_API:$IMAGE_TAG \
            -f Dockerfile.api .

      - name: Tag API image
        run: |
          docker tag \
            $ECR_REPOSITORY_API:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      - name: Push API image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      # ---------------------------------
      # Build Gradio
      # ---------------------------------

      - name: Build Gradio image
        run: |
          docker build \
            -t $ECR_REPOSITORY_GRADIO:$IMAGE_TAG \
            -f Dockerfile.gradio .

      - name: Tag Gradio image
        run: |
          docker tag \
            $ECR_REPOSITORY_GRADIO:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG

      - name: Push Gradio image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG

      # ---------------------------------
      # Configure Kubernetes
      # ---------------------------------

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ---------------------------------
      # Deploy to EKS
      # ---------------------------------

      - name: Update Kubernetes manifests
        run: |
          sed -i \
            "s|IMAGE_API|$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG|g" \
            k8s/api-deployment.yaml

          sed -i \
            "s|IMAGE_GRADIO|$ECR_REGISTRY/$ECR_REPOSITORY_GRADIO:$IMAGE_TAG|g" \
            k8s/gradio-deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/

      - name: Wait for API deployment
        run: |
          kubectl rollout status \
            deployment/healthcare-api \
            --timeout=5m

      - name: Wait for Gradio deployment
        run: |
          kubectl rollout status \
            deployment/healthcare-gradio \
            --timeout=5m